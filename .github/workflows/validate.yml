name: Validate Windows application
on:
  push:
    branches: [senpai]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - run: npm run native:build
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run package -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-validation-build
          path: |
            release/*-setup.exe
            release/*-portable.exe
            release/*.blockmap
            release/latest.yml
